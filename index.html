<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic Notion Calendar Widget</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; font-size: small; }
    .calendar {
      display: grid;
      grid-template-columns: 60px repeat(7, 1fr);
      gap: 2px;
      max-width: 430px;
      margin: auto;
    }
    .day, .empty, .weekday, .weeknum {
      padding: 10px; border: 1px solid #ccc; border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .weekday { font-weight: bold; background: #d5d5d7; }
    .weeknum { font-weight: bold; background: #f7f7f5; text-align: center; }
    .weeknum a { text-decoration: none; color: #2a5d69; }
    .weeknum:hover { background: #2a5d69; }
    .weeknum:hover a { color: white; }
    .day a { text-decoration: none; color: #333; }
    .day.weekday { background: #f0efeb; }
    .day.weekend { font-weight: bold; background: #ebd8dc; }
    .day.weekday:hover, .day.weekend:hover {
      background: #97637c; color: white; border: 1px solid #d79d31;
    }
    .day.weekday:hover a, .day.weekend:hover a {
      color: white; font-weight: bold;
    }
    .day.today { background: #a793ac; color: white !important; font-weight: bold; }
    .day.today a { color: white !important; }
    .month-header {
      font-size: 1.5em; margin: 20px 0; display: flex;
      justify-content: center; align-items: center; gap: 20px;
    }
    .month-header a { text-decoration: none; color: #d79d31; }
    .nav-btn {
      cursor: pointer; font-size: 1.2em; padding: 5px 10px;
      border: 1px solid #ccc; border-radius: 4px; background: #f0efeb;
    }
    .nav-btn:hover { background: #a793ac; }
    .today-btn {
      cursor: pointer; font-size: 1em; padding: 5px 15px;
      border: 1px solid #ccc; border-radius: 4px; background: #d5d5d7;
      margin-left: 10px;
    }
    .today-btn:hover { background: #a793ac; color: white; border: 1px solid #d79d31; }
    
    /* Highlight rollover weeks (weeks that belong to the next year) */
    .weeknum.rollover {
      background-color: #B4B393;   /* Satin Slipper highlight */
  /*    border: 1px solid #d79d31; */  /* subtle orange border */
      border-radius: 4px;
      font-weight: bold;
      color: #2a5d69;              /* darker text for contrast */
      padding: 4px 6px;
    }
  </style>
</head>
<body>
  <div class="month-header">
    <span class="nav-btn" onclick="prevMonth()">&#8592;</span>
    <a id="month-link" href="#" target="_blank" rel="noopener noreferrer">Month</a>
    <span class="nav-btn" onclick="nextMonth()">&#8594;</span>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>
 <div id="loading" style="margin:10px; font-style:italic; color:#666;">
 </div> <div class="calendar" id="calendar"></div>

 <script>
  const notionApiBase = 'https://notion-calendar-widget-eight.vercel.app/api/getNotionPage';
  const calendarEl = document.getElementById('calendar');
  const monthLink = document.getElementById('month-link');
  const loadingEl = document.getElementById('loading');
  const knownUrls = new Map();
  const pendingLinks = new Set();
  let currentDate = new Date();

  function bindJournalLink(link, name) {
    link.href = knownUrls.get(name) || '#';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.setAttribute('aria-label', `Open journal entry ${name}`);
    link.onclick = async function(event) {
      event.preventDefault();
      if (pendingLinks.has(name)) return;
      // Open synchronously during the user's gesture, before the API request,
      // so browsers do not block the tab as an unsolicited popup.
      const popup = window.open('', '_blank');
      if (popup) {
        popup.opener = null;
        popup.document.title = 'Opening journal…';
        popup.document.body.textContent = `Opening journal entry ${name}…`;
      }
      if (knownUrls.has(name)) {
        showJournalUrl(knownUrls.get(name), popup);
        return;
      }
      pendingLinks.add(name);
      link.setAttribute('aria-busy', 'true');
      loadingEl.textContent = `Opening ${name}… ⏳`;
      try {
        const response = await fetch(notionApiBase, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: name })
        });
        const data = await response.json();
        if (!response.ok || !data.url) throw new Error(data.error || 'Unable to open journal.');
        // Reject unexpected redirects even if the endpoint returns a malformed URL.
        const url = new URL(data.url);
        if (url.protocol !== 'https:' || !/(^|\.)notion\.(so|com)$/.test(url.hostname))
          throw new Error('The server returned an invalid journal link.');
        knownUrls.set(name, url.href);
        link.href = url.href;
        showJournalUrl(url.href, popup);
      } catch (error) {
        if (popup && !popup.closed) popup.close();
        loadingEl.textContent = `${error.message} Click the link again to retry.`;
        console.error(`Journal request failed for ${name}:`, error);
      } finally {
        pendingLinks.delete(name);
        link.removeAttribute('aria-busy');
      }
    };
  }

  function showJournalUrl(url, popup) {
    if (popup && !popup.closed) {
      popup.location.replace(url);
      loadingEl.textContent = '';
    } else {
      // If the embed/browser blocks popups, offer a normal user-clickable link.
      loadingEl.textContent = 'Journal ready — ';
      const openLink = document.createElement('a');
      openLink.href = url;
      openLink.target = '_blank';
      openLink.rel = 'noopener noreferrer';
      openLink.textContent = 'open your entry';
      loadingEl.appendChild(openLink);
    }
  }

  function formatDate(year, month, day) {
    return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }

  function getISOWeekYearAndNumber(date) {
    // UTC arithmetic avoids off-by-one week errors at daylight-saving changes.
    const tmp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
    const weekYear = tmp.getUTCFullYear();
    const yearStart = new Date(Date.UTC(weekYear, 0, 1));
    return { weekYear, weekNumber: Math.ceil(((tmp - yearStart) / 86400000 + 1) / 7) };
  }

  function renderCalendar(date) {
    // Rendering and navigation are entirely local: no fetches, no page creation.
    calendarEl.innerHTML = '';
    const year = date.getFullYear();
    const month = date.getMonth();
    monthLink.textContent = `${date.toLocaleString('default', { month: 'long' })} ${year}`;
    bindJournalLink(monthLink, `${year}-${String(month + 1).padStart(2, '0')}`);

    ['Wk', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(label => {
      const cell = document.createElement('div');
      cell.className = 'weekday';
      cell.textContent = label;
      calendarEl.appendChild(cell);
    });
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const rowCount = Math.ceil((firstDay + daysInMonth) / 7);
    const today = new Date();
    for (let row = 0; row < rowCount; row++) {
      const monday = new Date(year, month, 2 - firstDay + row * 7);
      const { weekYear, weekNumber } = getISOWeekYearAndNumber(monday);
      const weekCell = document.createElement('div');
      weekCell.className = 'weeknum';
      if (weekYear !== year) weekCell.classList.add('rollover');
      const weekLink = document.createElement('a');
      weekLink.textContent = weekYear === year ? `W${weekNumber}` : `W${weekNumber} (${weekYear})`;
      bindJournalLink(weekLink, `${weekYear}-W${weekNumber}`);
      weekCell.appendChild(weekLink);
      calendarEl.appendChild(weekCell);

      for (let dow = 0; dow < 7; dow++) {
        const day = row * 7 + dow - firstDay + 1;
        const cell = document.createElement('div');
        if (day < 1 || day > daysInMonth) {
          cell.className = 'empty';
        } else {
          cell.className = `day ${dow === 0 || dow === 6 ? 'weekend' : 'weekday'}`;
          if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear())
            cell.classList.add('today');
          const dayLink = document.createElement('a');
          dayLink.textContent = day;
          bindJournalLink(dayLink, formatDate(year, month + 1, day));
          cell.appendChild(dayLink);
        }
        calendarEl.appendChild(cell);
      }
    }
  }

  function prevMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1); renderCalendar(currentDate); }
  function nextMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1); renderCalendar(currentDate); }
  function goToday() { currentDate = new Date(); renderCalendar(currentDate); }
  renderCalendar(currentDate);
</script>
</body>
</html>
